spring.application.name=cloud_app

spring.datasource.url=jdbc:mysql://localhost:3306/local_repair_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT signing secret for local development only; replace it with a private environment value before deployment.
jwt.secret=cloudappjwtsecretkey2026securevalue
